[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmserveopt"
version = "0.1.0"
description = "LLM serving scheduling simulator, policy library, and selector research"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",    # for pandas .to_markdown()
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
datasets = [
    "transformers>=4.30",
]
# Required by src/llmserveopt/selector/* and selector training/eval scripts.
# Core simulator runs without these; install via: pip install -e ".[selector]"
selector = [
    "scikit-learn>=1.3",
    "joblib>=1.2",
]
# Required only by baselines/vllm_ltr/adapter/checkpoint_loader.py (loading
# the official vLLM-LTR OPT predictor checkpoint for offline score
# precomputation). Not imported by anything under src/llmserveopt; the core
# simulator and every registered policy/baseline run without this extra.
vllm_ltr = [
    "torch>=2.2",
    "transformers>=4.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "gpu: requires CUDA-capable GPU and ML model (skip on CPU-only CI)",
]

[tool.coverage.run]
source = ["src/llmserveopt"]
