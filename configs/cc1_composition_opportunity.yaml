    prompt_sigma: 0.4
    prompt_low: 256
    prompt_high: 1200
    output_mean: 96.0
    output_sigma: 0.5
    prediction_noise_rel: 0.15
  - tag: full_mixed_slo_id_test
    kind: synthetic
    split: ID_TEST
    regime: mixed_slo
    seed: 2101
    max_requests: 36
    arrival_process: poisson
    arrival_rate: 16.0
    duration: 4.0
    prompt_mean: 128.0
    prompt_sigma: 0.7
    output_mean: 96.0
    output_sigma: 0.7
    prediction_noise_rel: 0.15
  - tag: full_prefill_id_test
    kind: synthetic
    split: ID_TEST
    regime: prefill_heavy
    seed: 2102
    max_requests: 34
    arrival_process: poisson
    arrival_rate: 14.0
