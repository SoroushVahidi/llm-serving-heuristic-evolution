# Phase 2B.13 Selector Training and Suspicion Audit
#
# Goals:
#   1. Extend Phase 2B.12 to ≥200 total windows with genuine WG differentiation
#   2. Audit SCORPIO dominance: always-SCORPIO comparison, near-tie filtering,
#      completion-penalized objectives, leakage confirmation
#   3. Train RF/DT selectors with regret weighting if criteria pass
#   4. Evaluate safe-fallback, KNN, and per-policy regression selectors
#
# Key Phase 2B.12 finding:
#   Only dev_kv_pressure_decode_heavy (45 req/s, output_mean=384, slo_slack=0.8)
#   produced genuinely differentiated windows (0/6 all-complete, mean_gap=0.29).
#   All other 166/172 windows were all-complete (WG≈1.0 for all policies).
#   Near-tie at eps=0.001: 128/172 (74%) — labels reflect tie-breaking, not WG.
#
# Extension strategy:
#   A. Extend existing diversity workloads: seeds [6,7,8,9] → [6,7,8,9,10,11]
#      (~56 more windows — mostly all-complete but adds label diversity margin)
#   B. Add 6 new "genuinely differentiated" workloads:
#      Higher arrival rate + longer outputs + tighter SLOs → genuine KV pressure
#      These target regimes where SCORPIO's admission throttling measurably matters.
#   C. Existing regression + heldout: unchanged
#
# Runner: scripts/run_phase2b13_selector_training_and_suspicion_audit.py
# Output: results/phase2b13_selector_training_and_suspicion_audit/
# Log:    logs/phase2b13/phase2b13_selector_training.log

experiment: phase2b13_selector_training_and_suspicion_audit

output_dir: results/phase2b13_selector_training_and_suspicion_audit

# Phase 2B.12 reference for regression continuity
phase2b12_reference:
  rule_based_wg:
    dev: 0.9168
    heldout: 0.9803
    regression: 0.9518
    diversity: 0.9831
    overall: 0.9721
  best_fixed_wg:
    dev: 0.9878
    heldout: 0.9975
    regression: 0.9932
    diversity: 0.9969
    overall: 0.9956
  best_fixed_policy: scorpio_style_slo_guard
  n_windows: 172
  scorpio_label_fraction: 0.459
  near_tie_eps001_fraction: 0.744   # 128/172 windows had gap < 0.001
  near_tie_eps010_fraction: 0.826   # 142/172 windows had gap < 0.010
  all_complete_fraction: 0.936      # 161/172 windows had best_wg >= 0.99

simulator:
  step_size: 0.001
  drain_steps: 20000

service_model:
  enable_prefill_modeling: true
  prefill_cost_per_token: 1.0
  max_prefill_chunk_tokens: 512
  step_token_budget: 4096
  decode_first: false

gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 4096
    max_kv_tokens: 32768

window_size: 200
min_partial_window: 50
feature_mode: online_prefix

dev_seeds: [0, 1, 2]
heldout_seeds: [3, 4, 5]
# Extended from [6,7,8,9] to [6,7,8,9,10,11] (BurstGPT workloads only use seed 6)
diversity_seeds: [6, 7, 8, 9, 10, 11]

# Near-tie filtering thresholds (policy_margin = best_wg - second_best_wg)
near_tie_thresholds: [0.001, 0.005, 0.010]

# All-complete threshold
all_complete_threshold: 0.99

# RF/DT feasibility thresholds (applied to ALL windows, not just non-tie)
rf_feasibility:
  min_windows: 200
  min_policies_winning: 3
  min_windows_per_policy: 10
  max_single_policy_fraction: 0.85

# Selector training split
selector_training:
  train_groups: [dev, diversity]
  test_groups: [heldout]
  train_diversity_seeds: [6, 7, 8, 9, 10]
  val_diversity_seeds: [11]
  # Regret-weighting: sample_weight = (policy_margin + epsilon)
  regret_weight_epsilon: 0.001

# Objective sensitivity parameters (SCORPIO admission audit)
objective_sensitivity:
  completion_target: 0.95
  lambdas: [0.5, 1.0]
  # adjusted_score = wg - lambda * max(0, completion_target - completion_fraction)
  # completion_fraction per window estimated from mean over policies

# Safe-fallback selector margins
safe_fallback_margins: [0.001, 0.005, 0.010]

# KNN selector
knn:
  k: 5
  metric: euclidean

