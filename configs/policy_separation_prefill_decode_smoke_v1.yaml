# Compact smoke / calibration grid for Family B v1 launch gate.
# Not the full pilot — used to verify bidirectional separation before launch.

pilot_metadata:
  experiment_name: "policy_separation_prefill_decode_smoke_v1"
  version: "prefill_decode_v1"
  description: "Calibration smoke for prefill-decode family launch gate"
  require_burstgpt: true

sweep_grid:
  prefill_size_class: ["long", "medium"]
  decode_occupancy: ["low", "high"]
  slo_regime: ["ttft_tight", "tbt_tight"]
  offered_load: ["moderate"]
  seeds: [20260818]

fixed:
  n_decode: null
  n_prefill: null
  max_active_sequences: 512
  step_token_budget: 512

chunk_budgets:
  chunk_small: 64
  chunk_large: 256
  decode_priority_chunk: 64

policies:
  - "full_prefill"
  - "chunked_prefill_small"
  - "chunked_prefill_large"
  - "decode_priority_chunked"
  - "adaptive_prefill_control"

# 2*2*2*1*1 = 8 scenarios x 5 = 40 evaluations.
