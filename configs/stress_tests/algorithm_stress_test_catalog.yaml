    default_full_setting: {n_requests: 300}
    validation_metrics: [anwg, selector_regret_vs_best_fixed]
    acceptance_gates: "selector.anwg >= 0.95 * best_fixed_policy.anwg"
    real_system_followup_required: false

  - stress_test_id: selector_counter_out_of_distribution_regime_shift
    algorithm_id: regression_anwg
    algorithm_family: learned_meta_policy
    test_role: COUNTER
    evidence_class: HYPOTHESIZED_ADVERSARIAL_REGIME
    source_citations:
      - "General supervised-learning covariate-shift/concept-drift theory (textbook standard); no LLM-serving-selector-specific formal source applicable, since this is this project's own internal model -- see LITERATURE_RESEARCH_20260805.md §6"
    targeted_assumption: "Test-time feature distribution resembles the training distribution"
    workload_phenomenon: "A workload engineered to fall OUTSIDE the selector's documented training-window feature ranges (e.g. arrival-rate or KV-pressure combinations never seen in training), OR a rapid mid-run regime transition"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "The selector's dispatched-policy choice diverges from the best fixed policy for that window by a larger margin than in the target case; selector ANWG regret increases"
    comparison_algorithms: [scorpio_style_slo_guard, weighted_shortest_processing, fifo]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: ["window-level engineered features, see selector/dataset_v2/"]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 300, feature_profile: out_of_distribution, regime_transition_midpoint: 0.5}
    parameter_ranges: {}
    default_smoke_setting: {n_requests: 60}
    default_full_setting: {n_requests: 300}
    validation_metrics: [anwg, selector_regret_vs_best_fixed]
    acceptance_gates: "selector.selector_regret_vs_best_fixed > 2 * selector_target_in_distribution_regime.selector_regret_vs_best_fixed"
    real_system_followup_required: false

