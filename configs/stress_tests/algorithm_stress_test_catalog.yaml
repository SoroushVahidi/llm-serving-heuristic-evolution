    simulator_requirements: {offline_scored: true, single_gpu: true, requires_new_scoring_pass: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: ["precomputed aux_model_score against a reasoning-prompt corpus (not yet generated -- see real_system_followup_required)"]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {corpus: reasoning_heavy_synthetic_or_real_TBD, n_requests: 200}
    parameter_ranges: {}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    validation_metrics: [mean_latency, ranking_correlation_with_true_length]
    acceptance_gates: "vllm_ltr_counter.ranking_correlation_with_true_length < vllm_ltr_target.ranking_correlation_with_true_length"
    real_system_followup_required: true  # a new offline scoring pass against the real checkpoint on a reasoning-prompt corpus is required before this entry is executable

