  - stress_test_id: priority_counter_continuous_high_priority_starves_low
    algorithm_id: aging_priority
    algorithm_family: priority_with_aging
    test_role: COUNTER
    evidence_class: HYPOTHESIZED_ADVERSARIAL_REGIME
    source_citations:
      - "Reasoned directly from aging_priority's own linear aging formula (priority + aging_rate*wait); the aging_rate=0.15 default is this project's own parameter choice, not literature-derived"
    targeted_assumption: "High-priority arrivals do not saturate capacity indefinitely"
    workload_phenomenon: "A continuous stream of high-priority requests at a rate that alone saturates GPU capacity, alongside a trickle of low-priority requests"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "Low-priority requests' mean wait is substantially (multiple-x) worse than high-priority's -- linear aging (aging_rate=0.15) reduces but does not eliminate the gap within a realistic simulation horizon"
    comparison_algorithms: [fifo]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true, max_active_sequences: 2}
