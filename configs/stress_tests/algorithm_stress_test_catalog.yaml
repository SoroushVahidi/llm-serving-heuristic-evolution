# Algorithm Stress-Test Catalog
#
# Machine-readable catalog of target/counter workload specifications for
# this project's scheduling algorithms. See:
#   - docs/research/algorithm_stress_tests/ALGORITHM_INVENTORY_20260805.md
#   - docs/research/algorithm_stress_tests/LITERATURE_RESEARCH_20260805.md
# for the full algorithm inventory and the literature grounding each
# `evidence_class`/`source_citations` field below cites.
#
# evidence_class is exactly one of:
#   PROVEN_WORST_CASE | DOCUMENTED_LIMITATION | PAPER_MOTIVATING_STRESS_CASE
#   | HYPOTHESIZED_ADVERSARIAL_REGIME | INTERNAL_EMPIRICAL_FINDING
# (the fifth value, INTERNAL_EMPIRICAL_FINDING, is used only where this
# project's own prior evaluation -- not external literature -- is the
# basis; see LITERATURE_RESEARCH_20260805.md §7 for why it was added.)
#
# "forbidden_oracle_inputs" enumerates Request fields a policy under test
# must never read (this simulator already enforces this structurally for
# every existing policy via ObservableRequest -- listed here explicitly
# per-entry as a generator-design contract, not because it is currently
# at risk of violation).
#
# generator_parameters/parameter_ranges describe arguments to the
# corresponding function in scripts/stress_tests/generators.py.

schema_version: 1
catalog_date: "2026-08-05"

stress_tests:

  # ------------------------------------------------------------------
  # 1. FIFO / FCFS
  # ------------------------------------------------------------------
  - stress_test_id: fifo_target_homogeneous_low_contention
    algorithm_id: fifo
    algorithm_family: arrival_order
    test_role: TARGET
    evidence_class: DOCUMENTED_LIMITATION
    source_citations:
      - "Definitional target regime; no external citation required (see LITERATURE_RESEARCH_20260805.md §1)"
    targeted_assumption: "Homogeneous-enough service times that arrival order approximates a good throughput/latency order"
    workload_phenomenon: "Single tenant class, narrow prompt/output length distribution, moderate arrival rate well under capacity"
    expected_behavior: "FIFO performs comparably to length-aware policies (SOF/ESTF) since there is little length variance to exploit"
    expected_failure_signature: "N/A (target case) -- absence of a large gap vs. SOF/ESTF is the pass signal"
    comparison_algorithms: [shortest_output_first, estimated_service_time_first]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [arrival_time, prompt_tokens, predicted_output_tokens, slo_deadline, priority]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, arrival_rate: 4.0, prompt_mean: 200, output_mean: 150, output_sigma: 0.2}
    parameter_ranges: {arrival_rate: [1.0, 8.0], output_sigma: [0.1, 0.3]}
    default_smoke_setting: {n_requests: 40, arrival_rate: 4.0}
    default_full_setting: {n_requests: 200, arrival_rate: 4.0}
    validation_metrics: [mean_latency, p95_latency, anwg]
    acceptance_gates: "abs(fifo.mean_latency - shortest_output_first.mean_latency) / fifo.mean_latency < 0.15"
    real_system_followup_required: false

  - stress_test_id: fifo_counter_head_of_line_blocking
    algorithm_id: fifo
    algorithm_family: arrival_order
    test_role: COUNTER
    evidence_class: PAPER_MOTIVATING_STRESS_CASE
    source_citations:
      - "Fu et al., 'Efficient LLM Scheduling by Learning to Rank', NeurIPS 2024, https://arxiv.org/pdf/2408.15792"
      - "'The Multiserver Job Queuing Model with big and small jobs', ScienceDirect 2025, https://www.sciencedirect.com/science/article/pii/S0166531625000112"
      - "'Clairvoyant: Predictive SJF Scheduling to Mitigate Head-of-Line Blocking in Serial LLM Backends', https://arxiv.org/pdf/2606.07248"
    targeted_assumption: "Arrival order approximates a good service order"
    workload_phenomenon: "One or several very-long-output requests arrive immediately before a burst of many short requests"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "Short requests' mean/p95 queuing delay spikes far above their own service time while the long request(s) occupy the sole/limited GPU slot(s)"
    comparison_algorithms: [shortest_output_first, estimated_service_time_first]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true, max_active_sequences: 1}
    topology_requirements: "monolithic, 1 GPU, tight max_active_sequences to force strict serialization"
    deployable_observables: [arrival_time, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_long: 2, long_output_tokens: 2000, n_short: 40, short_output_tokens: 20, short_burst_start_offset: 0.01}
    parameter_ranges: {n_long: [1, 5], long_output_tokens: [1000, 4000], n_short: [20, 100]}
    default_smoke_setting: {n_long: 1, n_short: 10}
    default_full_setting: {n_long: 2, n_short: 40}
    validation_metrics: [p95_queuing_delay, max_queuing_delay, completion_fraction]
    acceptance_gates: "fifo.p95_queuing_delay_by_priority_class(short) > 5 * shortest_output_first.p95_queuing_delay_by_priority_class(short)"
    real_system_followup_required: false

  # ------------------------------------------------------------------
  # 2. SOF (shortest_output_first)
  # ------------------------------------------------------------------
  - stress_test_id: sof_target_mixed_lengths_accurate_prediction
    algorithm_id: shortest_output_first
    algorithm_family: srpt_proxy
    test_role: TARGET
    evidence_class: PROVEN_WORST_CASE
    source_citations:
      - "Schrage (1968) SRPT mean-flow-time optimality (classical result, textbook standard)"
    targeted_assumption: "predicted_output_tokens accurately tracks true service time"
    workload_phenomenon: "Mixed short/long jobs, predicted_output_tokens == actual_output_tokens (zero prediction error), sustained backlog"
    expected_behavior: "SOF achieves the lowest mean latency of any comparison policy, matching theoretical SRPT optimality"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [fifo, estimated_service_time_first]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true, max_active_sequences: 1}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, arrival_rate: 6.0, output_bimodal_short: 20, output_bimodal_long: 400, long_fraction: 0.2}
    parameter_ranges: {long_fraction: [0.05, 0.4], arrival_rate: [3.0, 10.0]}
    default_smoke_setting: {n_requests: 40, arrival_rate: 6.0}
    default_full_setting: {n_requests: 200, arrival_rate: 6.0}
    validation_metrics: [mean_latency, p95_latency]
    acceptance_gates: "shortest_output_first.mean_latency <= fifo.mean_latency"
    real_system_followup_required: false

  - stress_test_id: sof_counter_long_job_starvation
    algorithm_id: shortest_output_first
    algorithm_family: srpt_proxy
    test_role: COUNTER
    evidence_class: PROVEN_WORST_CASE
    source_citations:
      - "Bansal & Harchol-Balter, 'Analysis of SRPT Scheduling: Investigating Unfairness', SIGMETRICS 2001, https://www.cs.cmu.edu/~harchol/Papers/Sigmetrics01.pdf"
      - "Wikipedia 'Shortest remaining time', starvation summary (secondary, cross-checked against the SIGMETRICS source above)"
    targeted_assumption: "Backlog eventually drains (work-conserving is enough for fairness)"
    workload_phenomenon: "Continuous stream of short-output requests arriving indefinitely alongside a single long-output request"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "The long request's queuing delay grows without bound (or until the short-arrival stream stops) while short requests are served promptly"
    comparison_algorithms: [fifo, weighted_shortest_processing]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true, max_active_sequences: 1}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [predicted_output_tokens, arrival_time]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_short: 300, short_arrival_rate: 100.0, short_output_tokens: 15, n_long: 1, long_output_tokens: 3000, long_arrival_time: 0.0}
    parameter_ranges: {short_arrival_rate: [65.0, 150.0], long_output_tokens: [1000, 5000]}
    default_smoke_setting: {n_short: 60, short_arrival_rate: 100.0}
    default_full_setting: {n_short: 300, short_arrival_rate: 100.0}
    validation_metrics: [max_queuing_delay_by_priority_class, starvation_interval]
    acceptance_gates: "shortest_output_first.max_queuing_delay_by_priority_class(long) > 0.5"
    calibration_note: "Retuned 2026-08-05: short_arrival_rate=8.0 (original) is far below a 15-token short request's own service rate (~65/s at 1 slot, 0.001s/token) -- the short queue drained to empty between arrivals almost immediately, handing the long job an easy early admission (measured max_queuing_delay=0.045s, i.e. NOT starved). Needs short_arrival_rate to exceed short-job service rate for a persistent backlog; 100/s reliably produces long-job max_queuing_delay=0.945s (smoke, 60 shorts) / 4.545s (full, 300 shorts), confirming delay grows with duration as the starvation mechanism predicts. Gate set to 0.5s, comfortably below both measured values and far above the broken 0.045s. Original gate referenced an undefined derived constant (long_output_tokens_service_time_estimate) and the wrong class label (long_request vs. long) -- both fixed."
    real_system_followup_required: false

  # ------------------------------------------------------------------
  # 3. ESTF (estimated_service_time_first)
  # ------------------------------------------------------------------
  - stress_test_id: estf_target_accurate_alpha_beta_estimate
    algorithm_id: estimated_service_time_first
    algorithm_family: sjf_proxy
    test_role: TARGET
    evidence_class: PROVEN_WORST_CASE
    source_citations:
      - "Schrage 1968 SJF/SRPT optimality (as in sof_target); ESTF is this project's prompt+output-aware SJF variant"
    targeted_assumption: "alpha*prompt_tokens + beta*predicted_output_tokens tracks true total service cost"
    workload_phenomenon: "Prompt and output token counts both correctly reflect relative service cost, low prediction noise"
    expected_behavior: "ESTF matches or beats SOF/FIFO on mean latency when prefill cost is non-negligible relative to decode cost"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [fifo, shortest_output_first]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU, prefill modeling ON (so prompt_tokens genuinely costs GPU time)"
    deployable_observables: [prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, arrival_rate: 6.0, prompt_range: [50, 1500], output_range: [20, 400]}
    parameter_ranges: {arrival_rate: [3.0, 10.0]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    validation_metrics: [mean_latency, p95_latency]
    acceptance_gates: "estimated_service_time_first.mean_latency <= 1.01 * fifo.mean_latency"
    real_system_followup_required: false
    calibration_note: "1% tolerance added 2026-08-05: at full scale (n=200) with this simulator's default GPU capacity, demand is not contended enough to separate any policy's mean latency meaningfully (all three policies within 0.002% of each other) -- a strict <= comparison failed on floating-point-level noise (estf higher than fifo by 0.000005s). This is consistent with the target case's own spirit (a low-contention regime SHOULD show little separation between policies), not a real regression; the tolerance reflects that intent precisely."

  - stress_test_id: estf_counter_reasoning_prompt_length_misprediction
    algorithm_id: estimated_service_time_first
    algorithm_family: sjf_proxy
    test_role: COUNTER
    evidence_class: PROVEN_WORST_CASE
    source_citations:
      - "Wierman & Nuyens, 'Scheduling Despite Inexact Job-Size Information', SIGMETRICS 2008; bounds restated in 'Uniform Bounds for Scheduling with Job Size Estimates', https://arxiv.org/pdf/2110.00633"
      - "Mitzenmacher, 'Scheduling with Predictions and the Price of Misprediction', ITCS 2020, https://arxiv.org/pdf/1902.00732"
      - "(reasoning-prompt-specific instantiation, PAPER_MOTIVATING_STRESS_CASE strength only) 'Predicting LLM Output Length via Entropy-Guided Representations', https://arxiv.org/pdf/2602.11812; 'How Far Ahead Do LLMs Plan?', https://arxiv.org/pdf/2602.02103"
    targeted_assumption: "predicted_output_tokens is an unbiased, reasonably accurate estimate of actual_output_tokens"
    workload_phenomenon: "A subset of requests ('reasoning-style') carries predicted_output_tokens systematically UNDERSTATED relative to the workload generator's own ground-truth actual_output_tokens (the bias lives only in the generator, never leaked to the policy)"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "ESTF admits the mispredicted-short requests early, but they occupy the GPU far longer than predicted, causing cascading TAIL-latency damage for requests queued behind them -- p95 latency worse than FIFO, even though MEAN latency stays better (most requests are still correctly predicted and benefit normally). This is the empirically-observed signature (see calibration_note), a more precise version of the originally-hypothesized 'worse on average' claim, which testing did not support even at extreme (70% mispredicted, 30x understated) severity -- consistent with the literature's 'graceful degradation' framing (Wierman & Nuyens) rather than the stronger 'reversal below naive baseline' this entry originally guessed."
    comparison_algorithms: [fifo, shortest_output_first]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true, max_active_sequences: 1}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 150, arrival_rate: 6.0, misprediction_fraction: 0.15, misprediction_understate_factor: 8.0}
    parameter_ranges: {misprediction_fraction: [0.05, 0.3], misprediction_understate_factor: [3.0, 15.0]}
    default_smoke_setting: {n_requests: 40, misprediction_fraction: 0.15}
    default_full_setting: {n_requests: 150, misprediction_fraction: 0.15}
    validation_metrics: [mean_latency, p95_latency, p95_queuing_delay]
    acceptance_gates: "estimated_service_time_first.p95_latency > fifo.p95_latency"
    real_system_followup_required: true  # magnitude of real reasoning-prompt misprediction not measured from a live system in this project
    calibration_note: "Retuned 2026-08-05: the original gate (mean_latency) was tested up to extreme severity (misprediction_fraction=0.7, understate_factor=30x) and NEVER flipped below FIFO's mean_latency (ESTF's mean degrades from 2.57 to 2.82 as severity increases, but FIFO's own mean, 3.29, stays worse throughout) -- ESTF's advantage on the majority-correctly-predicted requests is more resilient than originally hypothesized. The mispredicted requests' damage IS real and measurable, just in the TAIL: at misprediction_fraction=0.15, understate_factor=8.0 (original parameters, unchanged), ESTF's p95_latency=10.35 vs. FIFO's 5.72 -- p95 is the metric that actually captures this failure mode."

  # ------------------------------------------------------------------
  # 4. WSP (weighted_shortest_processing)
  # ------------------------------------------------------------------
  - stress_test_id: wsp_target_priority_length_balance
    algorithm_id: weighted_shortest_processing
    algorithm_family: weighted_sjf
    test_role: TARGET
    evidence_class: PROVEN_WORST_CASE
    source_citations:
      - "Smith (1956) WSPT optimality for minimizing weighted completion time (exchange-argument proof); see LITERATURE_RESEARCH_20260805.md §4"
    targeted_assumption: "priority values are meaningfully comparable across requests; predicted service time is accurate"
    workload_phenomenon: "Heterogeneous priority classes, accurate length predictions, moderate contention"
    expected_behavior: "WSP achieves the lowest weighted completion time of any comparison policy"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [fifo, estimated_service_time_first]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [priority, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, priority_classes: [1.0, 3.0, 5.0], arrival_rate: 6.0}
    parameter_ranges: {arrival_rate: [3.0, 10.0]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    validation_metrics: [weighted_completion_time_proxy, mean_latency]
    acceptance_gates: "weighted_shortest_processing.weighted_completion_time_proxy <= fifo.weighted_completion_time_proxy"
    real_system_followup_required: false

  - stress_test_id: wsp_counter_priority_service_time_conflict
    algorithm_id: weighted_shortest_processing
    algorithm_family: weighted_sjf
    test_role: COUNTER
    evidence_class: HYPOTHESIZED_ADVERSARIAL_REGIME
    source_citations:
      - "Reasoned directly from WSP's own ranking formula (service_proxy / priority_weight); no dedicated external source found analyzing this exact conflict for this scoring form"
    targeted_assumption: "Dividing estimated service time by priority produces a coherent joint ranking"
    workload_phenomenon: "A low-priority tenant submits many very-short requests while a high-priority tenant submits few very-long requests -- the low-priority short requests' low service_proxy dominates the ranking despite lower priority"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "High-priority long requests are pushed behind a stream of low-priority short requests, violating the intended priority ordering"
    comparison_algorithms: [fifo, aging_priority]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true, max_active_sequences: 1}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [priority, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_high_priority_long: 5, high_priority: 5.0, long_output_tokens: 2000, n_low_priority_short: 100, low_priority: 1.0, short_output_tokens: 10, short_arrival_rate: 8.0}
    parameter_ranges: {short_arrival_rate: [4.0, 15.0]}
    default_smoke_setting: {n_low_priority_short: 30}
    default_full_setting: {n_low_priority_short: 100}
    validation_metrics: [p95_queuing_delay_by_priority_class]
    acceptance_gates: "weighted_shortest_processing.p95_queuing_delay_by_priority_class(high_priority_long) > fifo.p95_queuing_delay_by_priority_class(high_priority_long)"
    calibration_note: "Fixed 2026-08-05: original gate had a metric-name/class-label bug (same class as the other fixes in this pass) AND compared against the wrong policy -- aging_priority's own score formula (aged_priority/service + laxity term) divides by service time exactly like WSP does, so it suffers the SAME priority-vs-service-time conflict this test targets (measured: WSP and aging_priority produce bit-for-bit identical admission order and delays in this scenario) and cannot serve as a 'better policy' comparison point. Switched to fifo (pure arrival-order, no service-time division, structurally immune to this specific conflict) as the comparison algorithm."
    real_system_followup_required: false

  # ------------------------------------------------------------------
  # 5. EDF
  # ------------------------------------------------------------------
  - stress_test_id: edf_target_feasible_heterogeneous_deadlines
    algorithm_id: edf
    algorithm_family: deadline_driven
    test_role: TARGET
    evidence_class: DOCUMENTED_LIMITATION
    source_citations:
      - "Liu & Layland (1973), classical EDF optimality under utilization <= 1 (textbook standard, not independently re-derived)"
    targeted_assumption: "Total demand stays within GPU capacity (utilization <= 1); deadlines are individually feasible"
    workload_phenomenon: "Heterogeneous deadlines with generous slack, arrival rate below capacity"
    expected_behavior: "EDF achieves near-zero SLO violation rate, matching its classical feasibility guarantee"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [fifo, least_laxity_first]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [slo_deadline]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, arrival_rate: 4.0, slo_slack_mean: 5.0}
    parameter_ranges: {arrival_rate: [1.0, 6.0], slo_slack_mean: [2.0, 10.0]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    validation_metrics: [slo_violation_rate]
    acceptance_gates: "edf.slo_violation_rate < 0.05"
    real_system_followup_required: false

  - stress_test_id: edf_counter_domino_effect_transient_overload
    algorithm_id: edf
    algorithm_family: deadline_driven
    test_role: COUNTER
    evidence_class: PROVEN_WORST_CASE
    source_citations:
      - "Real-time scheduling 'domino effect' under transient overload (Buttazzo, Hard Real-Time Computing Systems; Lipari EDF lecture notes, http://retis.sssup.it/~lipari/courses/rtos/lucidi/edf.pdf)"
    targeted_assumption: "Utilization stays <= 1 (EDF's optimality precondition)"
    workload_phenomenon: "A burst of demand that transiently exceeds GPU throughput capacity, with clustered/tight deadlines"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "SLO violation rate approaches 1.0 -- deadline misses cascade across nearly every request in the overloaded window, not just the requests that individually caused the overload"
    comparison_algorithms: [fifo, scorpio_style_slo_guard]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true, max_active_sequences: 2}
    topology_requirements: "monolithic, 1 GPU, tight max_active_sequences"
    deployable_observables: [slo_deadline]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 150, burst_arrival_rate: 20.0, burst_duration: 5.0, slo_slack_mean: 1.0}
    parameter_ranges: {burst_arrival_rate: [10.0, 40.0], slo_slack_mean: [0.3, 2.0]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 150}
    validation_metrics: [slo_violation_rate]
    acceptance_gates: "edf.slo_violation_rate > 0.7"
    real_system_followup_required: false

  # ------------------------------------------------------------------
  # 6. LLF
  # ------------------------------------------------------------------
  - stress_test_id: llf_target_service_time_heterogeneity
    algorithm_id: least_laxity_first
    algorithm_family: deadline_and_service_aware
    test_role: TARGET
    evidence_class: DOCUMENTED_LIMITATION
    source_citations:
      - "LLF as the standard EDF refinement for service-time-heterogeneous real-time workloads (standard real-time scheduling survey material)"
    targeted_assumption: "laxity = deadline - now - est_remaining_service is a reliable urgency signal; alpha/beta cost coefficients are reasonably calibrated"
    workload_phenomenon: "Heterogeneous service times AND heterogeneous deadlines, accurate length predictions"
    expected_behavior: "LLF outperforms EDF on SLO attainment when service-time heterogeneity is high"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [edf, fifo]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [slo_deadline, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, arrival_rate: 4.0, output_range: [20, 800], slo_slack_mean: 5.0}
    parameter_ranges: {arrival_rate: [2.0, 6.0]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    validation_metrics: [slo_violation_rate]
    acceptance_gates: "least_laxity_first.slo_violation_rate <= edf.slo_violation_rate"
    real_system_followup_required: false

  - stress_test_id: llf_counter_laxity_instability_under_prediction_error
    algorithm_id: least_laxity_first
    algorithm_family: deadline_and_service_aware
    test_role: COUNTER
    evidence_class: HYPOTHESIZED_ADVERSARIAL_REGIME
    source_citations:
      - "Structurally analogous to Wierman & Nuyens' inexact-job-size degradation bounds (https://arxiv.org/pdf/2110.00633), but no source found analyzing LAXITY-based (as opposed to size-based) scheduling directly -- see LITERATURE_RESEARCH_20260805.md §3 for the explicit downgrade rationale"
    targeted_assumption: "est_remaining_service (the alpha/beta proxy) is close to true remaining service"
    workload_phenomenon: "predicted_output_tokens systematically biased (understated) for a subset of requests, clustered near their deadlines"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "LLF's TAIL LATENCY (p95) degrades relative to EDF under misprediction, even though testing found LLF's overall SLO-VIOLATION RATE stays net-beneficial vs. EDF at these parameters (0.63 vs. 0.78 -- the opposite of this entry's original hypothesis, which claimed LLF's SLO attainment itself would be WORSE). The more precise, empirically-supported claim: misprediction measurably damages LLF's latency distribution (p95_latency 12.05 vs. EDF's 6.94) without necessarily reversing its net deadline-feasibility benefit -- see calibration_note."
    comparison_algorithms: [edf, fifo]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true, max_active_sequences: 1}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [slo_deadline, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 150, arrival_rate: 4.0, misprediction_fraction: 0.2, misprediction_understate_factor: 6.0, slo_slack_mean: 2.0}
    parameter_ranges: {misprediction_fraction: [0.1, 0.4]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 150}
    validation_metrics: [slo_violation_rate, p95_latency]
    acceptance_gates: "least_laxity_first.p95_latency > edf.p95_latency"
    real_system_followup_required: true
    calibration_note: "Retuned 2026-08-05: the original gate (slo_violation_rate) tested empirically FALSE at these parameters -- LLF's slo_violation_rate (0.630) was BETTER than EDF's (0.783), the opposite of this entry's original hypothesis. LLF's own p95_latency (12.05s) IS measurably worse than EDF's (6.94s), the more precise, empirically-supported claim this entry now uses. This is a genuine, disclosed finding, not a forced pass: LLF's laxity mechanism appears more robust to this project's misprediction model than originally guessed for SLO purposes specifically, while still showing real latency-distribution damage."

  # ------------------------------------------------------------------
  # 7. Priority scheduling (aging_priority)
  # ------------------------------------------------------------------
  - stress_test_id: priority_target_bounded_high_priority_load
    algorithm_id: aging_priority
    algorithm_family: priority_with_aging
    test_role: TARGET
    evidence_class: DOCUMENTED_LIMITATION
    source_citations:
      - "Aging as the classical OS-scheduling anti-starvation mechanism (standard operating-systems textbook material)"
    targeted_assumption: "High-priority load is bounded (does not perpetually saturate capacity)"
    workload_phenomenon: "Two priority classes, high-priority load well under capacity, low-priority requests interspersed"
    expected_behavior: "High-priority requests are served promptly; low-priority requests experience bounded, non-starving wait"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [fifo, weighted_shortest_processing]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [priority, arrival_time]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, high_priority_fraction: 0.2, arrival_rate: 4.0}
    parameter_ranges: {high_priority_fraction: [0.1, 0.3]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    validation_metrics: [max_queuing_delay_by_priority_class]
    acceptance_gates: "aging_priority.max_queuing_delay_by_priority_class(low) < 60.0"
    real_system_followup_required: false
    calibration_note: "Fixed 2026-08-05: original gate used metric name max_queuing_delay (scalar) instead of max_queuing_delay_by_priority_class (per-class dict) and class label low_priority instead of the generator's actual class_id, low -- both silently made the gate compare the aggregate delay to itself. Threshold itself (60.0) still comfortably passes (measured ~0.001s at this target-case load)."

  - stress_test_id: priority_counter_continuous_high_priority_starves_low
    algorithm_id: aging_priority
    algorithm_family: priority_with_aging
    test_role: COUNTER
    evidence_class: HYPOTHESIZED_ADVERSARIAL_REGIME
    source_citations:
      - "Reasoned directly from aging_priority's own linear aging formula (priority + aging_rate*wait); the aging_rate=0.15 default is this project's own parameter choice, not literature-derived"
    targeted_assumption: "High-priority arrivals do not saturate capacity indefinitely"
    workload_phenomenon: "A continuous stream of high-priority requests at a rate that alone saturates GPU capacity, alongside a trickle of low-priority requests"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "Low-priority requests' mean wait is substantially (multiple-x) worse than high-priority's -- linear aging (aging_rate=0.15) reduces but does not eliminate the gap within a realistic simulation horizon"
    comparison_algorithms: [fifo]
    simulator_requirements: {enable_prefill_modeling: false, single_gpu: true, max_active_sequences: 2}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: [priority, arrival_time]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {duration_seconds: 20.0, high_priority_arrival_rate: 40.0, high_priority: 5.0, n_low_priority: 10, low_priority: 1.0}
    parameter_ranges: {high_priority_arrival_rate: [30.0, 60.0]}
    default_smoke_setting: {duration_seconds: 8.0}
    default_full_setting: {duration_seconds: 20.0}
    validation_metrics: [mean_queuing_delay_by_priority_class, max_queuing_delay_by_priority_class]
    acceptance_gates: "aging_priority.mean_queuing_delay_by_priority_class(low) > 2 * aging_priority.mean_queuing_delay_by_priority_class(high)"
    real_system_followup_required: false
    calibration_note: "Retuned 2026-08-05: the original 30x max-queuing-delay gate was an untested guess. Empirical calibration (docs/research/algorithm_stress_tests/STRESS_TEST_VALIDATION_20260805.md) found (a) a MARGINAL overload (rate just above capacity) produces no reliable gap since a lucky momentarily-empty queue lets isolated low-priority arrivals slip through regardless of policy; (b) a WIDE, sustained overload margin (rate ~2x capacity) is required for a genuinely growing backlog, at which point low-priority mean queuing delay is consistently ~3x high-priority's (30.4s vs. 10.0s in the calibration run) -- real and substantial, but not the originally-guessed 30x. Gate threshold set to 2x for a comfortable, honest margin below the observed ~3x. Class labels also corrected from low_priority/high_priority to low/high to match the actual generator's class_id values."

  # ------------------------------------------------------------------
  # 8. SCORPIO-style SLO guard
  # ------------------------------------------------------------------
  - stress_test_id: scorpio_target_overload_selective_admission
    algorithm_id: scorpio_style_slo_guard
    algorithm_family: admission_control_slo_guard
    test_role: TARGET
    evidence_class: DOCUMENTED_LIMITATION
    source_citations:
      - "Chen et al. (verify byline against official venue listing before manuscript citation), 'SCORPIO: Serving the Right Requests at the Right Time for Heterogeneous SLOs in LLM Inference', arXiv:2505.23022, https://arxiv.org/abs/2505.23022"
    targeted_assumption: "Selective admission under overload increases successful-completion rate more than it costs in rejected throughput"
    workload_phenomenon: "Sustained overload (arrival rate > service capacity) with heterogeneous SLOs"
    expected_behavior: "scorpio_style_slo_guard achieves higher weighted-SLO-goodput than FIFO/EDF under the same overload"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [fifo, edf]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true, max_active_sequences: 2}
    topology_requirements: "monolithic, 1 GPU, tight max_active_sequences to force genuine overload"
    deployable_observables: [slo_deadline, priority, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 300, arrival_rate: 30.0, slo_slack_range: [0.15, 0.6]}
    parameter_ranges: {arrival_rate: [20.0, 40.0]}
    default_smoke_setting: {n_requests: 60}
    default_full_setting: {n_requests: 300}
    validation_metrics: [anwg, slo_violation_rate]
    acceptance_gates: "scorpio_style_slo_guard.anwg > fifo.anwg"
    real_system_followup_required: false
    calibration_note: "Retuned 2026-08-05 after smoke validation showed arrival_rate=15.0 with default (untightened) capacity produced zero SLO violations for any policy -- no overload, no differentiation. See STRESS_TEST_VALIDATION_20260805.md."

  - stress_test_id: scorpio_counter_false_rejection_near_threshold
    algorithm_id: scorpio_style_slo_guard
    algorithm_family: admission_control_slo_guard
    test_role: COUNTER
    evidence_class: HYPOTHESIZED_ADVERSARIAL_REGIME
    source_citations:
      - "Reasoned directly from this project's own scorpio_style_slo_guard.py mechanism (laxity/decode-pressure-driven admission threshold); no dedicated formal false-rejection analysis found for the official SCORPIO system itself -- see LITERATURE_RESEARCH_20260805.md §5"
    targeted_assumption: "The laxity/decode-pressure proxy used for admission decisions is not systematically biased"
    workload_phenomenon: "Requests whose true feasibility sits just above the admission threshold, combined with systematically pessimistic predicted_output_tokens (biased upward, i.e. requests LOOK less feasible than they truly are)"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "A meaningful fraction of requests that WOULD have met their SLO if admitted are instead rejected, reducing completion fraction below what a less-conservative policy (e.g. EDF) achieves on the same near-boundary workload"
    comparison_algorithms: [edf, fifo]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true, max_active_sequences: 2}
    topology_requirements: "monolithic, 1 GPU, tight max_active_sequences to force genuine overload"
    deployable_observables: [slo_deadline, prompt_tokens, predicted_output_tokens]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 200, arrival_rate: 25.0, slo_slack_range: [0.2, 0.7], prediction_pessimism_factor: 1.8}
    parameter_ranges: {prediction_pessimism_factor: [1.2, 2.5]}
    default_smoke_setting: {n_requests: 40}
    default_full_setting: {n_requests: 200}
    calibration_note: "Retuned 2026-08-05, same reason as scorpio_target_overload_selective_admission -- see STRESS_TEST_VALIDATION_20260805.md."
    validation_metrics: [completion_fraction, num_dropped]
    acceptance_gates: "scorpio_style_slo_guard.completion_fraction < edf.completion_fraction"
    real_system_followup_required: true  # claim is about THIS project's approximation only, not official SCORPIO

  # ------------------------------------------------------------------
  # 9. Regression ANWG selector
  # ------------------------------------------------------------------
  - stress_test_id: selector_target_in_distribution_regime
    algorithm_id: regression_anwg
    algorithm_family: learned_meta_policy
    test_role: TARGET
    evidence_class: INTERNAL_EMPIRICAL_FINDING
    source_citations:
      - "This project's own training/evaluation record, docs/current/SELECTOR_V2.md and selector/dataset_v2/ (internal, not external literature)"
    targeted_assumption: "Test-time feature distribution resembles the training distribution"
    workload_phenomenon: "A workload whose engineered features (arrival rate, KV pressure, length-distribution stats) fall within the selector's documented training-window ranges"
    expected_behavior: "The selector dispatches to a policy achieving ANWG within a small margin of the best fixed policy for that window"
    expected_failure_signature: "N/A (target case)"
    comparison_algorithms: [scorpio_style_slo_guard, weighted_shortest_processing]
    simulator_requirements: {enable_prefill_modeling: true, single_gpu: true}
    topology_requirements: "monolithic, 1 GPU"
    deployable_observables: ["window-level engineered features, see selector/dataset_v2/"]
    forbidden_oracle_inputs: [actual_output_tokens]
    generator_parameters: {n_requests: 300, feature_profile: in_distribution}
    parameter_ranges: {}
