  - stress_test_id: vllm_ltr_counter_reasoning_domain_shift
    algorithm_id: vllm_ltr
    algorithm_family: learning_to_rank
    test_role: COUNTER
    evidence_class: PAPER_MOTIVATING_STRESS_CASE
    source_citations:
      - "Lykouris & Vassilvitskii consistency/robustness framework, formalized in Mitzenmacher ITCS 2020, https://arxiv.org/pdf/1902.00732"
      - "'Predicting LLM Output Length via Entropy-Guided Representations', https://arxiv.org/pdf/2602.11812; 'How Far Ahead Do LLMs Plan?', https://arxiv.org/pdf/2602.02103 (reasoning-length-unpredictability, applied here to a DIFFERENT paper's predictor -- classified PAPER_MOTIVATING_STRESS_CASE, not PROVEN_WORST_CASE, since neither source analyzes vLLM-LTR's own checkpoint directly)"
    targeted_assumption: "The predictor's learned ranking transfers to prompts outside its training distribution"
    workload_phenomenon: "A prompt corpus dominated by reasoning/chain-of-thought-style prompts, structurally different from the predictor's training/evaluation corpus -- requires a NEW offline scoring pass against the real checkpoint, not a runtime perturbation (see structural caveat in LITERATURE_RESEARCH_20260805.md §7)"
    expected_behavior: "N/A -- this IS the failure case"
    expected_failure_signature: "vLLM-LTR's ranking correlation with true output length degrades measurably relative to the target case, closing (or reversing) its latency/throughput advantage over FIFO"
