    targeted_assumption: "Chunking overhead is amortizable regardless of how little prefill cost there is to amortize it against"
    workload_phenomenon: "Short-bucket (100-target-token) prompts with long (600-1200-token) decode -- prefill is already cheap; chunked-prefill's own fixed per-chunk scheduling overhead has little to offset"
    expected_behavior: "N/A -- this IS the (hypothesized) failure case"
    expected_failure_signature: "sarathi_faithful shows no meaningful latency advantage over vllm_faithful (non-chunked, decode-first) in this regime, and may show a small deficit from chunking bookkeeping overhead with no prefill cost to amortize it against -- UNCONFIRMED hypothesis, not yet supported by any run in this project; see calibration_note"
    observed_behavior: "Measured (smoke scale): sarathi_faithful.mean_latency == vllm_chunked_prefill_faithful.mean_latency == vllm_faithful.mean_latency == fifo.mean_latency == 0.9285 (ALL FOUR policies byte-identical). The gate technically PASSES, but not for the hypothesized reason -- with short-bucket (100-token) prompts and step_token_budget=512/max_prefill_chunk_tokens=512, every prompt's ENTIRE prefill fits in a single step's chunk regardless of scheduling policy, so no scheduling decision this fixture makes is actually load-bearing at this scale (a degenerate tie, the same class of bug this project's own STRESS_TEST_VALIDATION_20260805.md calls '\"arrives alone, gets trivially admitted\"'). Does NOT confirm or refute the intended hypothesis."
    comparison_algorithms: [vllm_faithful, vllm_chunked_prefill_faithful, fifo]
    simulator_requirements: {enable_prefill_modeling: true, enable_decode_prefill_contention: true, max_prefill_chunk_tokens: 512, single_gpu: true, max_active_sequences: 16, max_batch_tokens: 4096, max_kv_tokens: 65536}
    topology_requirements: "monolithic, 1 GPU"
