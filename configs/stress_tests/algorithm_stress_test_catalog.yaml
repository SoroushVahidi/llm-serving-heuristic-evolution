    real_system_followup_required: true
    validation_status: "SIMULATOR_COMPATIBLE (fully representable) BUT DEGENERATE AT THIS SCALE -- gate passes trivially (see observed_behavior), not a confirmed finding; NOT real-hardware validated; local GPU (RTX 5060 Ti) NOT sufficient for a real-Sarathi-vs-real-vLLM comparison in this exact regime (same categorical CUDA/Blackwell blocker as the rest of this project's Sarathi work); Wulver required for real-hardware follow-up"
    provenance_notes: "Not derived from the Wulver validation (short_context_control was dropped from the repeated-trial pass without a decode-heavy pairing) -- a new, internally constructed hypothesis. Gate is a near-equality tolerance check (weak claim: 'no meaningful advantage'), not a directional win/loss claim, reflecting the genuinely unconfirmed status."
    calibration_note: "The 'PASS' here is honestly a degenerate tie (all 4 policies byte-identical, not just sarathi vs vllm_faithful), not evidence for the hypothesis. Revising this fixture to genuinely stress-test the mechanism (e.g. reducing max_prefill_chunk_tokens/step_token_budget well below 100 tokens so even a short prompt requires multiple chunks) was not attempted this pass, to avoid retuning parameters specifically until a directional result appears -- exactly the anti-pattern this project's own validation practice warns against. Left as an open, disclosed gap rather than force-resolved."

