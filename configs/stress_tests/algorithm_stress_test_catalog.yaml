    calibration_note: "Retuned 2026-08-05: the original 30x max-queuing-delay gate was an untested guess. Empirical calibration (docs/research/algorithm_stress_tests/STRESS_TEST_VALIDATION_20260805.md) found (a) a MARGINAL overload (rate just above capacity) produces no reliable gap since a lucky momentarily-empty queue lets isolated low-priority arrivals slip through regardless of policy; (b) a WIDE, sustained overload margin (rate ~2x capacity) is required for a genuinely growing backlog, at which point low-priority mean queuing delay is consistently ~3x high-priority's (30.4s vs. 10.0s in the calibration run) -- real and substantial, but not the originally-guessed 30x. Gate threshold set to 2x for a comfortable, honest margin below the observed ~3x. Class labels also corrected from low_priority/high_priority to low/high to match the actual generator's class_id values."

