# Configuration for Family B v2 PrefillControl composition falsification.
# See docs/design/prefill_control_composition_falsification.md.

experiment:
  family: "family_b_prefill_decode_v2"
  design: "prefill_control_composition_falsification_v2"
  primary_metric: "arrival_normalized_weighted_goodput"
  practical_eps: 0.01
  bootstrap_seeds:
    n_boot: 2000
    ci_alpha: 0.05
    seed: 20261201

parents:
  - name: "full_prefill"
    max_prefill_chunk_tokens: 65536
    decode_first: false
  - name: "chunked_prefill_small"
    max_prefill_chunk_tokens: 64
    decode_first: false

# Composition child: contextual chunk-size selection
child_control:
  chunk_options: [64, 96, 128, 192, 256, 65536]
  # Intermediate chunks that represent genuine behavior between the two parents
  intermediate_chunks: [96, 128, 192, 256]

# Fixed intermediate parents for baseline comparison
fixed_intermediate_parents:
  # Each is a GreedyArrivalPrefillControlPolicy with its own chunk size
  - name: "chunk_96"
    max_prefill_chunk_tokens: 96
  - name: "chunk_128"
    max_prefill_chunk_tokens: 128
  - name: "chunk_192"
    max_prefill_chunk_tokens: 192

baselines:
  - "full_prefill"
  - "chunked_prefill_small"
  - "best_fixed_parent"
  - "parent_oracle"
  - "contextual_top1"
  - "hard_conditional"
  - "contextual_alpha"
  # Fixed intermediates added programmatically
  - "best_fixed_intermediate"

# Family B v2 scenario template config
template:
  module: "llmserveopt.policy_separation.templates_prefill_decode_v2"
  function: "case_prefill_decode_ttft_contention"
  sweep_grid:
    hog_count: ["low", "high"]
    late_pressure: ["low", "high"]
    slo_emphasis: ["hog_ttft", "late_ttft"]
    seeds: [20260820, 20260821, 20260822, 20260823]

# Splits
splits:
  train:
    description: "seeds 20260820-22, first 8 scenarios by scenario_id"
  val:
    description: "seeds 20260820-22, next scenarios after train split off"
  test:
    description: "seed 20260823, late_pressure=low (preregistered held-out)"
  ood:
    description: "seed 20260823, late_pressure=high (interpolation challenge)"

# Selector training
selector:
  model_types: ["logreg", "tree"]
  n_boot: 2000
  seed: 20261201

# Runner settings
runner:
  workers: 8
  allow_synthetic_tokens: false
  require_burstgpt: false
  enable_prefill_modeling: true
  step_token_budget: 512
  max_active_sequences: 512
  enable_decode_prefill_contention: true
  decode_first: false
