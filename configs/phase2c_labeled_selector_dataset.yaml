experiment: phase2c_labeled_selector_dataset
label_version: phase2c_labels_v1

# ── Input paths ───────────────────────────────────────────────────────────────
inputs:
  phase2c2:
    training_rows: results/phase2c2_causal_selector_retraining/20260626_194325/training/causal_training_rows.csv
    train_split:   results/phase2c2_causal_selector_retraining/20260626_194325/training/causal_train_split.csv
    val_split:     results/phase2c2_causal_selector_retraining/20260626_194325/training/causal_val_split.csv
    eval_per_window: results/phase2c2_causal_selector_retraining/20260626_194325/evaluation/per_window.csv
  phase2c3:
    per_window_predictions: results/phase2c3_external_aware_orca_recovery/20260626_234942/per_window_predictions.csv
    selector_summary:       results/phase2c3_external_aware_orca_recovery/20260626_234942/selector_summary.csv
    external_loss_cases:    results/phase2c3_external_aware_orca_recovery/20260626_234942/external_loss_cases.csv
  failure_diagnosis:
    top_external_losses:    results/phase2c3_failure_diagnosis/20260626_phase2c2_analysis/top_external_losses.csv
    azure_conv_loss_summary: results/phase2c3_failure_diagnosis/20260626_phase2c2_analysis/azure_conv_loss_summary.json

# ── Output ────────────────────────────────────────────────────────────────────
output:
  root: results/phase2c_labeled_selector_dataset

# ── Labeling parameters ───────────────────────────────────────────────────────
near_tie_margin: 0.005

# Realistic-subset exclusion rules (matches Phase 2C.3 logic)
realistic_subset_rules:
  exclude_exact_prediction_workload: burstgpt_moderate_exact_prediction
  exclude_first_n_windows_of: burstgpt_scaled_high
  n_windows_to_exclude: 2

# ── Policy pools ──────────────────────────────────────────────────────────────
policy_pools:
  native_non_oracle:
    description: >
      Natively deployable policies, excluding the four purely external-style
      approximations and any oracle-assisted selectors.
    excluded_policies:
      - orca_style
      - vllm_style_token_budget
      - sarathi_style
      - splitfuse_style
    oracle_prefixes:
      - safe_fallback_wsp_margin

  external_style:
    description: >
      Internal approximations of well-known external LLM-serving policies.
    policies:
      - orca_style
      - vllm_style_token_budget
      - sarathi_style
      - splitfuse_style
      - multi_bin_batching
      - estimated_service_time_first
      - scorpio_style_slo_guard

  all_non_oracle:
    description: >
      All candidate policies, excluding only oracle-assisted selectors.
    oracle_prefixes:
      - safe_fallback_wsp_margin

  orca_vs_scorpio:
    description: >
      Binary pairwise comparison between orca_style and scorpio_style_slo_guard.
    policies:
      - orca_style
      - scorpio_style_slo_guard

# ── Regime-detection thresholds ──────────────────────────────────────────────
# These thresholds define feature-based regime labels that can be true
# regardless of workload name (e.g., is_azure_conv_like is feature-driven).
regime_thresholds:
  high_arrival_rate: 10.0     # feat_arrival_rate_est > threshold
  high_burstiness_cv: 1.0     # feat_burstiness_cv > threshold
  long_prompt_tokens: 1000    # feat_mean_prompt_tokens > threshold
  mixed_tight_slo_low:  0.4   # feat_fraction_tight_slo >= low AND
  mixed_tight_slo_high: 0.7   #   feat_fraction_tight_slo <= high

# ── Phase 2C.2 reference check ────────────────────────────────────────────────
# Script verifies these on eval data before proceeding with labeling.
phase2c2_reference_check:
  dt_anwg: 0.8021
  always_scorpio: 0.7963
  external_style_envelope: 0.8297
  external_loss_windows: 62
  tolerance: 5.0e-4

# Phase 2C.3 best selector to use for failure label generation
phase2c3_best_selector: native_non_oracle_dt

# ── API annotation (DISABLED) ─────────────────────────────────────────────────
# Live API annotations MUST NOT be used as ground-truth policy labels.
# This section is a placeholder for optional future qualitative annotation only.
# It will never activate unless an explicit --allow-live-api-annotation flag is
# added to the script — which this script currently does NOT have.
api_annotation:
  enabled: false
  provider: none
  max_calls: 0
  purpose: >
    Optional future qualitative annotation only.
    NOT used as ground-truth for policy labels.
  note: >
    LLM/API annotations are not used as ground-truth policy labels.
    Policy labels come exclusively from ANWG = reward_* * completion_*
    computed from simulator measurements.
