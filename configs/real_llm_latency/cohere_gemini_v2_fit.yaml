# Reference data for the v2 length-targeted real-LLM latency fit.
#
# STATUS: data only — NOT wired into the simulator. No loader in src/
# reads this file today. See docs/real_llm_simulator_integration_plan.md
# for why (hosted-API black-box latency and simulator-internal service-time
# modeling are different things) and what an actual integration would need.
#
# Source: experiments/real_llm/latency_model_fit_v2/ (fit from
# experiments/real_llm/cohere_v2_length_targeted_20260703T134447Z/ and
# experiments/real_llm/gemini_v2_length_targeted_20260703T141723Z/, both
# 108/108 requests, 0 failures). Regenerate with:
#   python scripts/fit_real_llm_latency_model_v2.py \
#     --experiment-dir experiments/real_llm/cohere_v2_length_targeted_20260703T134447Z \
#     --experiment-dir experiments/real_llm/gemini_v2_length_targeted_20260703T141723Z \
#     --output-dir experiments/real_llm/latency_model_fit_v2
#
# Only the "overall" (n=108, pooled across all three targets) decode rates
# are included below — see docs/real_llm_latency_model_v2.md's "which
# metrics are reliable" section for why the per-target-length decode rates
# (provider_decode_rates.csv) are NOT included here: several of those cells
# have R^2 < 0.5 and are fit noise, not a real measurement.

