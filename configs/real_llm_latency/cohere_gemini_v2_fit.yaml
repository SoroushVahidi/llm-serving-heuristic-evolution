    pilot's grid (targets 64/128/256, concurrency 1-8, 3 prompt buckets)
    are deliberately NOT summarized here — see
    experiments/real_llm/latency_model_fit_v2/provider_decode_rates.csv
    and docs/real_llm_latency_model_v2.md for the full, caveated numbers.
