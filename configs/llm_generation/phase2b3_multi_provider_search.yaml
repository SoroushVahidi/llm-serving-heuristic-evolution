# Phase 2B.3 multi-provider search — CloudRift + Cohere + Mistral
# Run when all three API keys are present.
#
# Usage:
#   python scripts/generate_llm_heuristics.py \
#       --providers cloudrift,cohere,mistral \
#       --models auto \
#       --max-candidates 50 \
#       --max-repair-attempts 3 \
#       --temperatures 0.3,0.7,1.0 \
#       --design-targets all \
#       --max-tokens 9000 \
#       --seed 20260615 \
#       --output-dir results/phase2b3_llm_search/candidates_multi_provider
#
# Note: CloudRift model requires max_tokens >= 8000 (thinking model).
#       Cohere and Mistral use standard max_tokens values.

search:
  max_candidates: 50
  max_repair_attempts: 3
  temperature_values: [0.3, 0.7, 1.0]
  max_tokens: 9000
  seed: 20260615
  design_targets:
    - slo_urgency
    - kv_pressure
    - throughput_oriented
    - prefill_heavy
    - mixed_slo
    - noisy_prediction_robust
    - balanced

providers:
  - name: cloudrift
    model: Qwen/Qwen3.6-35B-A3B-FP8
    enabled_if_key_present: CLOUDRIFT_API_KEY
    note: Thinking model — max_tokens >= 8000 required

  - name: cohere
    model: command-r-plus-08-2024
    enabled_if_key_present: COHERE_API_KEY

  - name: mistral
    model: mistral-large-latest
    enabled_if_key_present: MISTRAL_API_KEY

evaluation:
  objective: priority_weighted_slo_goodput
  split_policy:
    tune_on: train_validation_only
    holdout_test: true
  baselines:
    - fifo
    - edf
    - least_laxity_first
    - estimated_service_time_first
    - shortest_output_first
    - slo_slack_score
    - vllm_style_token_budget
    - sarathi_style
    - splitfuse_style
    - best_fit

notes:
  - oracle_srtf is excluded from all deployable comparisons
  - RF Selector provisional until rerun with 18 policies
  - Heuristics evaluated deterministically in simulator
  - No LLM called at runtime during scheduling
