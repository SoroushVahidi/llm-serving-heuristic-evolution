# Phase 2B.3 controlled LLM heuristic search — CloudRift provider
# Model: Qwen/Qwen3.6-35B-A3B-FP8 (thinking model; max_tokens >= 8000 required)
#
# Usage:
#   python scripts/generate_llm_heuristics.py \
#       --providers cloudrift \
#       --models Qwen/Qwen3.6-35B-A3B-FP8 \
#       --max-candidates 30 \
#       --max-repair-attempts 3 \
#       --temperatures 0.3,0.7,1.0 \
#       --design-targets all \
#       --max-tokens 9000 \
#       --seed 20260615 \
#       --output-dir results/phase2b3_llm_search/candidates_main

search:
  max_candidates: 30
  max_repair_attempts: 3
  temperature_values: [0.3, 0.7, 1.0]
  max_tokens: 9000
  seed: 20260615
  design_targets:
    - slo_urgency
    - kv_pressure
    - throughput_oriented
    - prefill_heavy
    - mixed_slo
    - noisy_prediction_robust
    - balanced

providers:
  - name: cloudrift
    model: Qwen/Qwen3.6-35B-A3B-FP8
    enabled_if_key_present: CLOUDRIFT_API_KEY
    note: >
      Thinking model — requires max_tokens >= 8000.
      Content may be in reasoning field if max_tokens is too small.

evaluation:
  objective: priority_weighted_slo_goodput
  split_policy:
    tune_on: train_validation_only
    holdout_test: true
  baselines:
    - fifo
    - edf
    - least_laxity_first
    - estimated_service_time_first
    - shortest_output_first
    - slo_slack_score
    - vllm_style_token_budget
    - sarathi_style
    - splitfuse_style
    - best_fit

notes:
  - oracle_srtf is excluded from all deployable comparisons
  - RF Selector from Phase 2A.3 was trained on 16 policies; rerun with 18 needed for paper
  - estimated_service_time_first is PARS-inspired proxy, not a PARS reproduction
  - No LLM is called at runtime during request scheduling
