# Policy Separation Family A v2 Pilot Configuration
# Orthogonal size × priority fairness-vs-size design.
# See docs/design/POLICY_SEPARATION_FAMILY_A_V2.md
#
# Production runs REQUIRE staged BurstGPT (no silent synthetic fallback).
# Primary metric: RunMetrics.arrival_normalized_weighted_goodput

pilot_metadata:
  experiment_name: "policy_separation_fairness_starvation_pilot_v2"
  version: "fairness_starvation_v2"
  description: "Orthogonal size×priority fairness-vs-size pilot (ESTF↔WFS niches)"
  predecessor_job: 1182306
  predecessor_verdict: "USEFUL_DIAGNOSTIC_ONLY / REDESIGN_REQUIRED"
  require_burstgpt: true

sweep_grid:
  favored_tenant_size: ["short", "long"]
  tenant_weight_skew: [1.0, 5.0, 10.0]
  # Calibrated 2026-08-16 local smoke: util band + tight favored SLO +
  # max_active_sequences=1 reduced Aging monopoly while preserving ESTF↔WFS
  # bidirectional niches (see design doc §10).
  target_utilization: [1.10, 1.30, 1.50]
  prediction_noise_sigma: [0.0, 0.30]
  seeds: [20260816, 20260817]

fixed:
  n_total_jobs: 120
  max_active_sequences: 1
  favored_slo_slack_s: 1.0
  other_slo_slack_s: 8.0

policies:
  - "fifo"
  - "estimated_service_time_first"
  - "aging_priority"
  - "weighted_fair_share"

# 2*3*3*2*2 = 72 scenarios × 4 policies = 288 evaluations
