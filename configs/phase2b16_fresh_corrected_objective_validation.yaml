# Phase 2B.16 Fresh Corrected Objective Validation
#
# Goals:
#   Test whether Phase 2B.15's rf_anwg gain over always-SCORPIO (+0.016) survives
#   evaluation on fresh, unseen simulation windows.  Selectors are frozen from
#   Phase 2B.15 training data before any fresh window is evaluated.
#
# Design constraints:
#   - All fresh validation workloads use seeds NOT used in Phase 2B.13/2B.15.
#     Phase 2B.13 used dev=[0,1,2], heldout=[3,4,5], diversity=[6,7,8,9,10,11].
#     Phase 2B.16 uses diversity=[12,13,14,15], heldout=[20,21,22].
#   - Selectors are retrained on Phase 2B.13 TRAIN SPLIT (dev s0-2, div s6-10) only.
#   - No tuning on fresh validation windows.
#   - 20 deployable policies evaluated per window.
#   - scorpio_deadline_only included as comparison-only ablation (not selector candidate).
#
# Expected fresh windows: ~220-300 (depending on arrival rates and durations).
# Estimated runtime: ~50-90 minutes in tmux.
#
# Runner: scripts/run_phase2b16_fresh_corrected_objective_validation.py
# Log:    logs/phase2b16/phase2b16_fresh_validation.log
# tmux:   phase2b16_fresh_validation
# Output: results/phase2b16_fresh_corrected_objective_validation/

experiment: phase2b16_fresh_corrected_objective_validation

# Training data source (Phase 2B.13 per_window.csv)
input_b13_dir: results/phase2b13_selector_training_and_suspicion_audit

# Phase 2B.14 ablation data (for scorpio_deadline_only comparison)
input_b14_dir: results/phase2b14_metric_audit_scorpio_ablation

output_dir: results/phase2b16_fresh_corrected_objective_validation

# Simulator settings (same as Phase 2B.13)
simulator:
  step_size: 0.001
  drain_steps: 20000

service_model:
  enable_prefill_modeling: true
  prefill_cost_per_token: 1.0
  max_prefill_chunk_tokens: 512
  step_token_budget: 4096
  decode_first: false

gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 4096
    max_kv_tokens: 32768

window_size: 200
min_partial_window: 50
feature_mode: online_prefix

# Fresh seeds — NOT used in Phase 2B.13/2B.15
fresh_diversity_seeds: [12, 13, 14, 15]   # 4 new seeds for diversity workloads
fresh_heldout_seeds: [20, 21, 22]          # 3 new seeds for heldout workloads

# Phase 2B.13 training split (for selector training; do NOT retrain on fresh)
selector_training:
  train_diversity_seeds: [6, 7, 8, 9, 10]
  val_diversity_seeds: [11]
  near_tie_filter_epsilon: 0.005
  regret_weight_epsilon: 0.001

# Safe-fallback WSP margins (same as Phase 2B.15)
safe_fallback_margins: [0.001, 0.005, 0.010]

knn:
  k: 5
  metric: euclidean

# Metric evaluation
near_tie_thresholds: [0.001, 0.005, 0.010]
all_complete_threshold: 0.99

completion_penalized:
  configs:
    - target: 0.95
      lambda: 0.5
      key: cp_wg_t095_l05
    - target: 0.95
      lambda: 1.0
      key: cp_wg_t095_l10
    - target: 0.99
      lambda: 0.5
      key: cp_wg_t099_l05
    - target: 0.99
      lambda: 1.0
      key: cp_wg_t099_l10

# Constrained objective thresholds
constrained_objectives:
  completion_thresholds: [0.95, 0.99]

# Statistical analysis
bootstrap:
  n_samples: 2000
  random_seed: 42
  ci: 0.95

# Top-epsilon accuracy thresholds
top_epsilon_thresholds: [0.001, 0.005, 0.010]

# Phase 2B.15 reference (for regression check)
phase2b15_reference:
  rf_anwg_test_anwg: 0.9795
  always_scorpio_test_anwg: 0.9638
  always_wsp_test_anwg: 0.9463
  safe_fallback_wsp_test_anwg: 0.9848
  n_b13_windows: 319
  n_heldout_windows: 33

