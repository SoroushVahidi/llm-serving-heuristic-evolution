  # ==========================================================================
  # FRESH TARGETED GROUP
  # New discriminative workloads designed to produce non-SCORPIO wins.
  # Seeds [12, 13, 14, 15].
  # ==========================================================================

  - tag: fresh_tgt_completion_sensitive_moderate
    # Low-load, all-loose-SLO regime: SCORPIO has no incentive to reject.
    # Expected: FIFO/EDF/WSP win (CF=1.0), SCORPIO CF=1.0 too → tie-breaker.
    # Tests: whether selector correctly keeps SCORPIO-equivalent policies.
    group: fresh_targeted
    arrival_process: poisson
    arrival_rate: 25.0
    duration: 10.0
    prompt_dist: lognormal
    prompt_mean: 128.0
    prompt_sigma: 0.5
    prompt_low: 32
    prompt_high: 512
    output_dist: lognormal
    output_mean: 96.0
    output_sigma: 0.6
    output_low: 16
    output_high: 384
    prediction_noise_rel: 0.10
    slo_classes:
      - {class_id: loose, slo_slack: 10.0, priority: 1.0, weight: 1.00}

  - tag: fresh_tgt_long_decode_loose_slo
    # Long outputs, medium/loose SLO only — WSP/SOF/best_fit advantage.
    # No tight SLO → SCORPIO's rejection hurts CF without protecting SLO.
    # Expected: WSP/SOF/best_fit beat SCORPIO under arrival-norm WG.
    group: fresh_targeted
    arrival_process: poisson
    arrival_rate: 40.0
    duration: 10.0
    prompt_dist: lognormal
    prompt_mean: 64.0
    prompt_sigma: 0.4
    prompt_low: 16
    prompt_high: 256
    output_dist: lognormal
    output_mean: 384.0
    output_sigma: 0.5
    output_low: 128
    output_high: 1024
    prediction_noise_rel: 0.15
    slo_classes:
      - {class_id: medium, slo_slack: 10.0, priority: 2.0, weight: 0.60}
      - {class_id: loose,  slo_slack: 25.0, priority: 1.0, weight: 0.40}

  - tag: fresh_tgt_short_output_sjf_regime
    # Short uniform outputs, tight SLO, low noise — SJF/ESTF regime.
    # Predicted outputs accurate (low noise) → ESTF/SOF can sort correctly.
    # Expected: ESTF/SOF beat FIFO/SCORPIO via short-job-first ordering.
    group: fresh_targeted
    arrival_process: poisson
    arrival_rate: 50.0
    duration: 8.0
    prompt_dist: lognormal
    prompt_mean: 64.0
    prompt_sigma: 0.3
    prompt_low: 32
    prompt_high: 128
    output_dist: lognormal
    output_mean: 28.0
    output_sigma: 0.3
    output_low: 16
    output_high: 64
    prediction_noise_rel: 0.05
    slo_classes:
      - {class_id: tight,  slo_slack: 2.0,  priority: 3.0, weight: 0.50}
      - {class_id: medium, slo_slack: 8.0,  priority: 2.0, weight: 0.50}

  - tag: fresh_tgt_moderate_overload_completion
    # Moderate overload, medium SLO slack — neither tight nor trivial.
    # SCORPIO may reject while EDF/WSP/admission_control complete all.
    # Expected: admission_control or WSP competes with SCORPIO.
    group: fresh_targeted
    arrival_process: poisson
    arrival_rate: 55.0
