# Phase 2B.6 Fair Sweep: all 19 deployable policies, 3 workload types, 2 seeds.
# Kept cheap: duration=10s, arrival_rate=10-20, drain_steps=20000.
# DO NOT run oracle_srtf here — oracle is non-deployable.
# Results go to results/phase2b6_fair_sweep_failure_audit/
experiment: phase2b6_fair_sweep

simulator:
  step_size: 0.001
  drain_steps: 20000

service_model:
  enable_prefill_modeling: true
  prefill_cost_per_token: 1.0
  max_prefill_chunk_tokens: 512
  step_token_budget: 4096
  decode_first: false

gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 4096
    max_kv_tokens: 32768

workloads:
  - tag: mixed_slo_small
    arrival_process: poisson
    arrival_rate: 15.0
    duration: 10.0
    prompt_dist: lognormal
    prompt_mean: 128.0
    prompt_sigma: 0.7
    prompt_low: 16
    prompt_high: 512
    output_dist: lognormal
    output_mean: 96.0
    output_sigma: 0.7
    output_low: 8
    output_high: 512
    prediction_noise_rel: 0.15
    slo_classes:
      - {class_id: tight,  slo_slack: 0.4,  priority: 3.0, weight: 0.50}
      - {class_id: medium, slo_slack: 5.0,  priority: 2.0, weight: 0.35}
      - {class_id: loose,  slo_slack: 20.0, priority: 1.0, weight: 0.15}

  - tag: prefill_heavy_small
    arrival_process: poisson
    arrival_rate: 10.0
    duration: 10.0
    prompt_dist: lognormal
    prompt_mean: 512.0
    prompt_sigma: 0.5
    prompt_low: 128
    prompt_high: 2048
    output_dist: lognormal
    output_mean: 32.0
    output_sigma: 0.4
    output_low: 4
    output_high: 128
    prediction_noise_rel: 0.20
    slo_classes:
      - {class_id: tight,  slo_slack: 2.0,  priority: 2.0, weight: 0.60}
      - {class_id: loose,  slo_slack: 15.0, priority: 1.0, weight: 0.40}

  - tag: noise_bursty_small
    arrival_process: poisson
    arrival_rate: 20.0
    duration: 10.0
    prompt_dist: lognormal
    prompt_mean: 64.0
    prompt_sigma: 1.0
    prompt_low: 8
    prompt_high: 256
    output_dist: lognormal
    output_mean: 64.0
    output_sigma: 1.2
    output_low: 4
    output_high: 512
    prediction_noise_rel: 0.30
    slo_classes:
      - {class_id: tight,  slo_slack: 0.5,  priority: 3.0, weight: 0.30}
      - {class_id: medium, slo_slack: 3.0,  priority: 2.0, weight: 0.50}
      - {class_id: loose,  slo_slack: 10.0, priority: 1.0, weight: 0.20}

policies:
  - fifo
  - edf
  - shortest_output_first
  - shortest_prompt_first
  - greedy_token_fill
  - least_loaded
  - multi_bin_batching
  - random_feasible
  - first_fit
  - best_fit
  - orca_style
  - vllm_style_token_budget
  - sarathi_style
  - splitfuse_style
  - slo_slack_score
  - weighted_shortest_processing
  - least_laxity_first
  - estimated_service_time_first
  - admission_control

seeds: [42, 0]

output:
  save_figures: false
  save_latex: false
  verbose: true
