schema_version: 1
mode: cc4
seed: 20260803
policy_subset:
- fifo
- edf
- weighted_shortest_processing
- estimated_service_time_first
- scorpio_style_slo_guard
cc1b_borda_baseline:
  policy_subset:
  - weighted_shortest_processing
  - scorpio_style_slo_guard
  - edf
  - estimated_service_time_first
  - fifo
  method: borda
  top_k: 2
  weights:
    weighted_shortest_processing: 0.5
    scorpio_style_slo_guard: 0.5
candidate_search:
  primitive_pool:
  - name: laxity_urgency
    higher_is_preferred: true
  - name: priority
    higher_is_preferred: true
  - name: queue_age
    higher_is_preferred: true
  - name: predicted_output_length
    higher_is_preferred: false
  - name: prompt_length
    higher_is_preferred: false
  - name: estimated_service_time
    higher_is_preferred: false
  weight_grid_step: 0.5
  weight_grid_top_k: 2
  topk_mixture_k_values:
  - 1
  - 2
  - 3
  admission_gate_laxity_thresholds:
  - 0.0
  - 0.05
  placement_key_variants:
  - []
  - - projected_gpu_load
  - - projected_gpu_load
    - kv_pressure
metrics:
  primary: arrival_normalized_weighted_goodput
  completion_fraction_tolerance: 0.005
near_tie_primary_threshold: 0.005
near_tie_thresholds:
- 0.001
- 0.005
- 0.01
development_splits:
- TRAIN
- VALIDATION
evaluation_splits:
- ID_TEST
- OOD_TEST
safeguards:
  max_runs: 20000
  require_clean_git_for_full: true
  forbid_live_api: true
  forbid_gpu: true
  forbid_real_vllm: true
outputs:
  root: results/cc4b_oracle_composition_expansion
service_model:
  step_size: 0.001
  enable_prefill_modeling: true
  prefill_cost_per_token: 1.0
  max_prefill_chunk_tokens: 128
  step_token_budget: 128
  enable_decode_prefill_contention: false
  decode_first: false
simulator:
  drain_steps: 2500
gpus:
- gpu_id: 0
  max_active_sequences: 4
  max_batch_tokens: 64
  max_kv_tokens: 1200
workloads:
