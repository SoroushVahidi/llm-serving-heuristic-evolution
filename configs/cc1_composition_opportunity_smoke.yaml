schema_version: 1
mode: smoke
seed: 20260731
policy_subset:
  - weighted_shortest_processing
  - edf
  - fifo
composition:
  operator: weighted_borda_rank_aggregation
  implementation: StaticRankEnsemblePolicy
  method: borda
  normalization: per_state_normalized_rank
  top_k: 2
  weight_grid_step: 0.5
metrics:
  primary: arrival_normalized_weighted_goodput
  completion_fraction_tolerance: 0.005
thresholds:
  aggregate_anwg_gain: 0.005
  regime_specific_gain: 0.01
  stop_non_near_tie_gap: 0.002
near_tie_primary_threshold: 0.005
near_tie_thresholds: [0.001, 0.005, 0.01]
development_splits: [TRAIN, VALIDATION]
evaluation_splits: [ID_TEST]
safeguards:
  max_runs: 50
  require_clean_git_for_full: true
  forbid_live_api: true
  forbid_gpu: true
  forbid_real_vllm: true
outputs:
  root: results/cc1_composition_opportunity
  decision_traces: false
service_model:
  step_size: 0.001
simulator:
  drain_steps: 5000
gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 64
    max_kv_tokens: 2048
workloads:
  - tag: smoke_underloaded_train
    kind: synthetic
    split: TRAIN
    regime: underloaded
    seed: 101
    max_requests: 12
    arrival_process: poisson
    arrival_rate: 2.0
    duration: 3.0
    prompt_mean: 32.0
    prompt_sigma: 0.2
    output_mean: 12.0
    output_sigma: 0.2
    prediction_noise_rel: 0.0
  - tag: smoke_mixed_validation
    kind: synthetic
    split: VALIDATION
    regime: mixed_slo
    seed: 102
    max_requests: 16
    arrival_process: poisson
    arrival_rate: 6.0
    duration: 3.0
    prompt_mean: 64.0
    prompt_sigma: 0.3
    output_mean: 24.0
    output_sigma: 0.3
    prediction_noise_rel: 0.1
  - tag: smoke_prefill_test
    kind: synthetic
    split: ID_TEST
    regime: prefill_heavy
    seed: 103
    max_requests: 18
    arrival_process: poisson
    arrival_rate: 8.0
    duration: 3.0
    prompt_mean: 256.0
    prompt_sigma: 0.4
    prompt_low: 128
    prompt_high: 512
    output_mean: 16.0
    output_sigma: 0.3
    prediction_noise_rel: 0.1

