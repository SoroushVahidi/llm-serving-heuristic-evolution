# Phase 2B.13 Selector Training After Diversity
#
# Extends Phase 2B.12 from 172 windows to 230+ windows by:
#   1. Extending diversity seeds from [6,7,8,9] to [6,7,8,9,10,11] (+~54 windows)
#   2. Adding 2 new overloaded-loose-SLO workloads designed to create genuine WG gaps
#      (not just tie-breaking labels), targeting WSP/EDF/best_fit over SCORPIO
#
# After reaching ≥200 windows, trains RF and DT selectors on (dev + diversity)
# windows and evaluates on the regression heldout split.
#
# Phase 2B.12 key finding: 166/172 windows are "all-complete" (WG≈1.0 for all
# policies). Only dev_kv_pressure_decode_heavy (n=6, WG=0.95) is meaningfully
# differentiated. RF/DT training proceeds but may primarily learn tie-breaking
# patterns rather than genuine WG improvements.
#
# Runner: scripts/run_phase2b13_selector_training_after_diversity.py
# Output: results/phase2b13_selector_training_after_diversity/
# Log:    logs/phase2b13/phase2b13_selector_training.log

experiment: phase2b13_selector_training_after_diversity

output_dir: results/phase2b13_selector_training_after_diversity

# Phase 2B.12 reference for regression continuity
phase2b12_reference:
  rule_based_wg:
    dev: 0.9168
    heldout: 0.9803
    regression: 0.9518
    diversity: 0.9831
    overall: 0.9721
  best_fixed_wg:
    dev: 0.9878
    heldout: 0.9975
    regression: 0.9932
    diversity: 0.9969
    overall: 0.9956
  best_fixed_policy: scorpio_style_slo_guard
  n_windows: 172
  scorpio_label_fraction: 0.459
  policies_winning_10plus: 6

simulator:
  step_size: 0.001
  drain_steps: 20000

service_model:
  enable_prefill_modeling: true
  prefill_cost_per_token: 1.0
  max_prefill_chunk_tokens: 512
  step_token_budget: 4096
  decode_first: false

gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 4096
    max_kv_tokens: 32768

window_size: 200
min_partial_window: 50
feature_mode: online_prefix

dev_seeds: [0, 1, 2]
heldout_seeds: [3, 4, 5]
# Extended from [6,7,8,9] to [6,7,8,9,10,11] — adds ~54 more windows across
# synthetic diversity workloads (BurstGPT workloads still use seed=6 only)
diversity_seeds: [6, 7, 8, 9, 10, 11]

# RF/DT training feasibility thresholds (same as Phase 2B.12)
rf_feasibility:
  min_windows: 200
  min_policies_winning: 3
  min_windows_per_policy: 10
  max_single_policy_fraction: 0.85

# Selector training split definition
# Train: dev + diversity (seeds 6–10)
# Validation: diversity seed 11 only (within-diversity held-aside)
# Test: regression heldout (seeds 3–5) — never used for rule design or training
selector_training:
  train_groups: [dev, diversity_train]   # diversity seeds 6-10
  val_groups: [diversity_val]            # diversity seed 11
  test_groups: [heldout]
  train_diversity_seeds: [6, 7, 8, 9, 10]
  val_diversity_seeds: [11]

# Minimal rule selector repair targets (Phase 2B.12 fail_008, fail_009)
rule_selector_repair:
  apply: true
  changes:
    - rule: 5
      description: "Prefill-heavy: change target from sarathi_style to admission_control"
      condition: "mean_prompt > 512 OR p95_prompt > 1024"
      old_policy: sarathi_style
      new_policy: admission_control
      evidence: "admission_control wins all 16 prefill-heavy diversity windows (Phase 2B.12)"
      note: "WG impact is ~0 (all-complete regime); improves secondary metric accuracy"

