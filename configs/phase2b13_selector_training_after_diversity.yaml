    prompt_sigma: 0.7
    prompt_low: 16
    prompt_high: 512
    output_dist: lognormal
    output_mean: 96.0
    output_sigma: 0.7
    output_low: 8
    output_high: 512
    prediction_noise_rel: 0.15
    slo_classes:
