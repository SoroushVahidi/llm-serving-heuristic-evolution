  # =========================================================================
  # NEW HIGH-DIFFERENTIATION WORKLOADS (Phase 2B.13 additions)
  # =========================================================================
  # These workloads are designed to produce WG gaps >1% between policies,
  # not just tie-breaking on secondary metrics.
  #
  # Target: regimes where SCORPIO's admission throttling HURTS WG because
  # SLO is loose enough that completion matters more than per-request quality.

  - tag: div_overloaded_all_loose_slo
    # Very high load (75 req/s) with ONLY loose SLO.
    # SCORPIO may throttle unnecessarily (credit budget fires even without tight SLO),
    # reducing completion_fraction while EDF/FIFO/best_fit complete all requests.
    # Target winner: edf or best_fit or multi_bin_batching
    group: diversity
    arrival_process: poisson
    arrival_rate: 75.0
    duration: 8.0
    prompt_dist: lognormal
    prompt_mean: 96.0
    prompt_sigma: 0.5
    prompt_low: 32
    prompt_high: 384
    output_dist: lognormal
    output_mean: 80.0
    output_sigma: 0.6
