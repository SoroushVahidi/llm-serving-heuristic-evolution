# Mixed-SLO workload: overloaded with heterogeneous deadlines to expose EDF/SLO
# policies. Queueing pressure should make tight/medium/loose classes diverge in
# violation rate instead of collapsing to FIFO-like behavior.
experiment: mixed_slo_comparison

simulator:
  step_size: 0.001
  drain_steps: 200000

service_model:
  enable_prefill_modeling: true
  prefill_cost_per_token: 1.0
  max_prefill_chunk_tokens: 512
  step_token_budget: 4096
  decode_first: false

gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 4096
    max_kv_tokens: 32768

workloads:
  - tag: mixed_slo
    arrival_process: poisson
    arrival_rate: 38.0             # reduced from 90.0: target ~90% GPU utilization (capacity ~41 req/s)
    duration: 30.0                 # increased from 20.0: more samples
    prompt_dist: lognormal
    prompt_mean: 128.0
    prompt_sigma: 0.7
    prompt_low: 16
    prompt_high: 512
    output_dist: lognormal
    output_mean: 96.0
    output_sigma: 0.7
    output_low: 8
    output_high: 512
    prediction_noise_rel: 0.15
    slo_classes:
      - {class_id: tight,  slo_slack: 0.4,  priority: 3.0, weight: 0.50}  # more tight requests; achievable but tight
      - {class_id: medium, slo_slack: 5.0,  priority: 2.0, weight: 0.35}  # clearly distinct from tight
      - {class_id: loose,  slo_slack: 20.0, priority: 1.0, weight: 0.15}  # very loose

policies:
  - fifo
  - edf
  - shortest_output_first
  - orca_style
  - vllm_style_token_budget
  - sarathi_style
  - slo_slack_score

seeds: [0, 1, 2]

output:
  save_figures: true
  save_latex: false
  verbose: true
