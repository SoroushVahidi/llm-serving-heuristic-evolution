# Phase 2A.3 TEST dataset
# Hardest conditions: high load + high noise + bursty
# DO NOT use for training or hyperparameter tuning.

seed: 7
window_size: 200
feature_mode: online_prefix
verbose: false

simulator:
  step_size: 0.001
  drain_steps: 10000

gpus:
  - gpu_id: 0
    max_active_sequences: 4
    max_batch_tokens: 512
    max_kv_tokens: 8192

workloads:
  # --- Very high load + noise: hardest condition ---
  - tag: test_very_overloaded_noise
    arrival_process: poisson
    arrival_rate: 100.0
    duration: 2.5
    prompt_dist: lognormal
    prompt_mean: 16.0
    prompt_sigma: 0.5
    prompt_low: 4
    prompt_high: 64
    output_dist: lognormal
    output_mean: 50.0
    output_sigma: 1.4
    output_low: 1
    output_high: 512
    prediction_noise_rel: 0.30

  # --- Extreme bursty: surge management matters ---
  - tag: test_extreme_bursty
    arrival_process: bursty
    arrival_rate: 80.0
    duration: 3.0
    prompt_dist: lognormal
    prompt_mean: 24.0
    prompt_sigma: 0.8
    prompt_low: 8
    prompt_high: 256
    output_dist: lognormal
    output_mean: 60.0
    output_sigma: 1.3
    output_low: 4
    output_high: 512
    prediction_noise_rel: 0.35
    burst_factor: 8.0
    burst_fraction: 0.25
    slo_classes:
      - {class_id: tight,  slo_slack: 0.3,  priority: 3.0, weight: 0.50}
      - {class_id: medium, slo_slack: 2.0,  priority: 2.0, weight: 0.35}
      - {class_id: loose,  slo_slack: 15.0, priority: 1.0, weight: 0.15}

  # --- BurstGPT scaled high: real-trace high-load test ---
  - tag: test_burstgpt_high
    source: extended_jsonl
    trace_path: data/processed/burstgpt/burstgpt_scaled_high_10k.jsonl
    max_requests: 1000
